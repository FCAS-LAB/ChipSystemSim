# Derived from artifact/bfs_cuda/bfs.yml for fault localization only.
# The process graph and arguments are unchanged except that process 0 is
# wrapped by GDB.  Its backtrace is written to gpgpusim.0.0.log.
phase1:
  - cmd: "gdb"
    args: ["--batch", "-ex", "run", "-ex", "thread apply all bt", "--args", "$BENCHMARK_ROOT/bin/bfs_cu", "0", "0"]
    log: "gpgpusim.0.0.log"
    is_to_stdout: false
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/bfs_cu"
    args: ["0", "1"]
    log: "gpgpusim.0.1.log"
    is_to_stdout: false
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/bfs_cu"
    args: ["0", "2"]
    log: "gpgpusim.0.2.log"
    is_to_stdout: false
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/bfs_cu"
    args: ["1", "0"]
    log: "gpgpusim.1.0.log"
    is_to_stdout: false
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/mnsim"
    args: ["1", "1"]
    log: "mnsim.1.1.log"
    is_to_stdout: false
    clock_rate: 1
  - cmd: "$BENCHMARK_ROOT/bin/dsa"
    args: ["1", "2"]
    log: "dsa.1.2.log"
    is_to_stdout: false
    clock_rate: 1
  - cmd: "$SIMULATOR_ROOT/snipersim/run-sniper"
    args: ["--", "$BENCHMARK_ROOT/bin/bfs_c", "5", "5"]
    log: "sniper.5.5.log"
    is_to_stdout: false
    clock_rate: 1
phase2:
  - cmd: "$SIMULATOR_ROOT/popnet_chiplet/build/popnet"
    args: ["-A", "36", "-c", "1", "-V", "3", "-B", "12", "-O", "12", "-F", "4", "-L", "1000", "-T", "10000000", "-r", "1", "-I", "../bench.txt", "-R", "4", "-G", "../topology/star_6_6_flit_4.gv", "-D", "../delayInfo.txt", "-P"]
    log: "popnet_0.log"
    is_to_stdout: false
    clock_rate: 1
bench_file: "./bench.txt"
delayinfo_file: "./delayInfo.txt"
