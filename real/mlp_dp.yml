# Four data ranks (CPU at y=0) plus two GPU workers per rank (y=1,2).
# All configurations retain these 12 phase-one processes; node count only
# changes placement, never the global batch, shard membership, or reduction order.
phase1:
  - cmd: "$SIMULATOR_ROOT/snipersim/run-sniper"
    args: ["--", "$BENCHMARK_ROOT/bin/mlp_dp_cpu", "0", "0"]
    log: "sniper.rank0.log"
    is_to_stdout: true
    clock_rate: 1
  - cmd: "$SIMULATOR_ROOT/snipersim/run-sniper"
    args: ["--", "$BENCHMARK_ROOT/bin/mlp_dp_cpu", "1", "0"]
    log: "sniper.rank1.log"
    is_to_stdout: true
    clock_rate: 1
  - cmd: "$SIMULATOR_ROOT/snipersim/run-sniper"
    args: ["--", "$BENCHMARK_ROOT/bin/mlp_dp_cpu", "2", "0"]
    log: "sniper.rank2.log"
    is_to_stdout: true
    clock_rate: 1
  - cmd: "$SIMULATOR_ROOT/snipersim/run-sniper"
    args: ["--", "$BENCHMARK_ROOT/bin/mlp_dp_cpu", "3", "0"]
    log: "sniper.rank3.log"
    is_to_stdout: true
    clock_rate: 1
  - cmd: "$BENCHMARK_ROOT/bin/mlp_dp_gpu"
    args: ["0", "1"]
    log: "gpgpusim.rank0.gpu0.log"
    is_to_stdout: true
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/mlp_dp_gpu"
    args: ["0", "2"]
    log: "gpgpusim.rank0.gpu1.log"
    is_to_stdout: true
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/mlp_dp_gpu"
    args: ["1", "1"]
    log: "gpgpusim.rank1.gpu0.log"
    is_to_stdout: true
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/mlp_dp_gpu"
    args: ["1", "2"]
    log: "gpgpusim.rank1.gpu1.log"
    is_to_stdout: true
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/mlp_dp_gpu"
    args: ["2", "1"]
    log: "gpgpusim.rank2.gpu0.log"
    is_to_stdout: true
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/mlp_dp_gpu"
    args: ["2", "2"]
    log: "gpgpusim.rank2.gpu1.log"
    is_to_stdout: true
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/mlp_dp_gpu"
    args: ["3", "1"]
    log: "gpgpusim.rank3.gpu0.log"
    is_to_stdout: true
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"
  - cmd: "$BENCHMARK_ROOT/bin/mlp_dp_gpu"
    args: ["3", "2"]
    log: "gpgpusim.rank3.gpu1.log"
    is_to_stdout: true
    clock_rate: 1
    pre_copy: "$SIMULATOR_ROOT/gpgpu-sim/configs/tested-cfgs/SM7_TITANV/*"

phase2:
  - cmd: "$SIMULATOR_ROOT/popnet_chiplet/build/popnet"
    args: ["-A", "36", "-c", "1", "-V", "3", "-B", "12", "-O", "12", "-F", "4", "-L", "1000", "-T", "1000000000", "-r", "1", "-I", "../bench.txt", "-R", "4", "-G", "../topology/mesh_6_6_flit_4.gv", "-D", "../delayInfo.txt", "-P"]
    log: "popnet.log"
    is_to_stdout: false
    clock_rate: 1
bench_file: "./bench.txt"
delayinfo_file: "./delayInfo.txt"
