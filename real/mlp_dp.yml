# Eight data ranks (CPU at y=0) plus two GPU workers per rank (y=1,2).
# All configurations retain these 24 phase-one processes; node count only
# changes placement, never the global batch, shard membership, or reduction order.
phase1:
  - cmd: "$SIMULATOR_ROOT/snipersim/run-sniper"
    args: ["--", "$BENCHMARK_ROOT/bin/mlp_dp_cpu", "0", "0"]
    log: "sniper.rank0.log"
    is_to_stdout: true
    clock_rate: 1
  - cmd: "$SIMULATOR_ROOT/snipersim/run-sniper"
    args: ["--", "$BENCHMARK_ROOT/bin/mlp_dp_cpu", "1", "0"]
    log: "sniper.rank1.log"
